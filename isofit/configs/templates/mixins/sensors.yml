# Sensor mixins: overlays without `^^` that apply apply_oe's hardcoded
# per-sensor defaults, layered on top of a run section of the `tc` pipeline
# (see bases/tc.yml), e.g.
#   isofit retrieval run -c pipeline -m emit ...
#
# Files under ${output.dir}/data/ are copies the setup stage makes of the
# matching `setup` source file.

# EMIT instrument noise, uncertainty, model discrepancy, EOFs, and windows
emit:
  setup:
    channelized_uncertainty_file: ${env.data}/emit_osf_uncertainty.txt
    model_discrepancy_file: ${env.data}/emit_model_discrepancy.mat
    eof_file: ${env.data}/emit_eofs.txt
  forward_model:
    model_discrepancy_file: ${output.dir}/data/model_discrepancy.mat
    instrument:
      SNR: null
      parametric_noise_file: ${env.data}/emit_noise.txt
      unknowns:
        channelized_radiometric_uncertainty_file: ${output.dir}/data/channelized_uncertainty.txt
      eof_path: ${output.dir}/data/eof.txt
      # One element per EOF column, using apply_oe's DefaultRCCPrior
      statevector:
        EOF_1: {bounds: [0.01, 10.0], scale: 1.0, prior_mean: 1.0, prior_sigma: 10.0, init: 1.0}
        EOF_2: {bounds: [0.01, 10.0], scale: 1.0, prior_mean: 1.0, prior_sigma: 10.0, init: 1.0}
        EOF_3: {bounds: [0.01, 10.0], scale: 1.0, prior_mean: 1.0, prior_sigma: 10.0, init: 1.0}
  implementation:
    inversion:
      windows: [[350.0, 1325.0], [1435.0, 1800.0], [1965.0, 2500.0]]


# AVIRIS-3 inversion windows
av3:
  implementation:
    inversion:
      windows: [[380.0, 1350.0], [1435.0, 1800.0], [1970.0, 2500.0]]


# AVIRIS-Classic instrument noise
avcl:
  forward_model:
    instrument:
      SNR: null
      parametric_noise_file: ${env.data}/avirisc_noise.txt


# PACE OCI instrument noise and solar irradiance
oci:
  forward_model:
    instrument:
      SNR: null
      parametric_noise_file: ${env.data}/oci/oci_noise.txt
    atmosphere:
      irradiance_file: ${env.data}/oci/tsis_f0_0p1.txt


# Tanager-1 instrument noise
tanager:
  forward_model:
    instrument:
      SNR: null
      parametric_noise_file: ${env.data}/tanager1_noise_20241016.txt
