# Retrieval mixins: overlays without `^^` that enable the optional stages of the
# `tc` pipeline (see bases/tc.yml), layered on top of `pipeline` with
#   isofit retrieval run -c pipeline -m <mixin> ...
#
# Each mixin chooses between alternatives by repointing the files `pipeline`'s
# stages exchange, e.g. `copy_inputs` sets `setup.rdn` to a copy under
# ${output.dir}/input/, which every reader of `setup.rdn` then follows.

copy_inputs:  # apply_oe: --copy_input_files
  description: Copy the input files into the working directory before processing
  setup:
    rdn: ${output.dir}/input/${input.fid}_rdn
    obs: ${output.dir}/input/${input.fid}_obs
    loc: ${output.dir}/input/${input.fid}_loc


interpolate_radiance:  # apply_oe: --interpolate_bad_rdn
  description: Interpolate bad radiance channels before the retrieval
  preprocess:
    interpolate_radiance: true
    rdn: ${output.dir}/input/${input.fid}_rdn_interp


skyview:  # apply_oe: --skyview_factor slope
  description: Compute the sky view factor from the terrain slope
  preprocess:
    skyview: slope
    svf: ${output.dir}/data/sky_view_factor


classify:  # apply_oe: --classify_multisurface
  description: Classify the scene into surface types for a multisurface retrieval
  surface:
    classify: true
    classes: ${output.dir}/input/${input.fid}_surface_class


prebuilt_lut:  # apply_oe: --prebuilt_lut; set forward_model.atmosphere.lut_path
  description: Use a prebuilt LUT instead of building one
  lut: {enabled: false, prebuilt: true}


empirical_line:  # apply_oe: --empirical_line
  description: Invert the superpixels, then extend to every pixel by empirical line
  segment: {enabled: true}
  interpolate: {enabled: true, method: empirical}
  configure: {layers: [subs]}


analytical_line:  # apply_oe: --analytical_line
  description: Invert the superpixels, then extend to every pixel by analytical line
  segment: {enabled: true}
  interpolate: {enabled: true, method: analytical}
  configure: {layers: [subs]}


background_rfl:  # apply_oe: --presolve --use_background_rfl
  description: Presolve over the superpixels to estimate and use a background reflectance
  segment: {enabled: true}
  presolve:
    enabled: true
    # The presolve runs over the superpixels
    layers: [subs, presolve]
    state: ${output.dir}/output/${input.fid}_subs_h2o
  background: {enabled: true}
  forward_model:
    surface: {use_background_rfl: true}
