# ISOFIT base configuration defaults.
#
# `default` holds the complete set of defaults for every config section, mirroring
# the Pydantic models in isofit/configs/sections. It uses the prebuilt engine,
# which needs no radiative transfer code; the engine mixins (mixins/engines.yml)
# swap in another engine along with its own defaults, e.g.
#   load("default", mixin="modtran")
# or, from another base, `^^: [default.yml:default, ../mixins/engines.yml:modtran]`.
#
# Paths default to the ISOFIT ini via `${env.<key>}`; the `env` section is
# injected by isofit.configs.loader.load.

default:
  description: Complete set of defaults for every config section, using a prebuilt LUT
  input:
    sensor: null
    fid: null
    measured_radiance_file: null
    reference_reflectance_file: null
    reflectance_file: null
    obs_file: null
    glt_file: null
    loc_file: null
    background_reflectance_file: null
    radiometry_correction_file: null
    skyview_factor_file: null

  output:
    dir: ./isofit-output/
    reset: false
    estimated_state_file: null
    estimated_reflectance_file: null
    estimated_emission_file: null
    modeled_radiance_file: null
    apparent_reflectance_file: null
    path_radiance_file: null
    simulated_measurement_file: null
    algebraic_inverse_file: null
    atmospheric_coefficients_file: null
    radiometry_correction_file: null
    spectral_calibration_file: null
    posterior_uncertainty_file: null
    plot_surface_components: false
    mcmc_samples_file: null

  log:
    file: null
    level: INFO
    append: True
    config: null
    resources: false

  # Retrieval pipeline (isofit retrieval), see isofit/retrieval/pipeline.py.
  # The paths between stages are unset here; see tc.yml:pipeline for a layout
  lut:
    enabled: true
    exit: false
    prebuilt: false
    no_min_spacing: false
    elevation: {spacing: 0.25, spacing_min: 0.2, range: null}
    observer_zenith: {spacing: 10, spacing_min: 2, range: null}
    solar_zenith: {spacing: 10, spacing_min: 2, range: null}
    relative_azimuth: {spacing: 60, spacing_min: 25, range: null}
    h2o: {spacing: 0.25, spacing_min: 0.03, range: null}
    aerosol: {spacing: 0.1, spacing_min: 0, range: null}
    co2: {spacing: 60, spacing_min: 60, range: [380, 440]}

  setup:
    enabled: true
    rdn: null
    obs: null
    loc: null
    wavelength_file: null
    channelized_uncertainty_file: null
    model_discrepancy_file: null
    eof_file: null

  preprocess:
    enabled: true
    interpolate_radiance: false
    rdn: null
    skyview: null
    svf: null

  scene:
    enabled: true
    atmosphere_type: ATM_MIDLAT_SUMMER
    trim_lines: 5
    max_flight_duration: 8
    file: null

  surface:
    enabled: true
    file: null
    classify: false
    classes: null

  segment:
    enabled: false
    size: 40
    npca: 5
    labels: null
    rdn: null
    obs: null
    loc: null
    svf: null
    surface_class: null

  presolve:
    enabled: false
    grid_points: 10
    layers: []
    file: null
    template: null
    state: null

  background:
    enabled: false
    rfl: null
    subs: null

  configure:
    enabled: true
    aerosol_climatology_file: null
    layers: []
    file: null

  invert:
    enabled: true

  interpolate:
    enabled: false
    method: analytical
    num_neighbors: []
    atm_sigma: [2]

  cleanup:
    enabled: true
    remove: []

  forward_model:
    model_discrepancy_file: null

    surface:
      multi_surface_flag: false
      use_background_rfl: false
      surface_file: null
      surface_category: null
      surface_class_file: null
      base_surface_class_file: null
      Surfaces: {}
      wavelength_file: null
      select_on_init: true
      selection_metric: Euclidean
      emissivity_for_surface_T_init: 0.98
      terrain_style: flat
      max_slope: 90.0
      refractive_index_path: ""
      statevector:
        SURF_TEMP_K: null
        SKY_GLINT: null
        SUN_GLINT: null

    atmosphere:
      # Defaults to a prebuilt LUT so no RT code is required; the engine
      # sections below swap this out for a physics-based / emulated engine.
      engine:
        name: prebuilt
      wavelength_file: null
      lut_path: ${output.dir}/lut/lut.zarr
      sim_path: ${output.dir}/lut/sims
      lut_grid: {}
      lut_subset: {}
      rt_mode: transm
      statevector_names: []
      statevector: {}
      unknowns: {}
      configure_and_exit: false
      interpolator_style: mlg_numba
      wavelength_range: null
      multipart_transmittance: false
      irradiance_file: null

    instrument:
      wavelength_file: null
      integrations: null
      unknowns:
        channelized_radiometric_uncertainty_file: null
        uncorrelated_radiometric_uncertainty: null
        wavelength_calibration_uncertainty: null
        stray_srf_uncertainty: null
        dn_uncertainty_file: null
      fast_resample: true
      SNR: 500
      parametric_noise_file: null
      pushbroom_noise_file: null
      nedt_noise_file: null
      eof_path: null
      rcc_prior_file: null
      wlspl_prior_file: null
      statevector:
        EOF_1: null
        EOF_2: null
        EOF_3: null
        GROW_FWHM: null
        WL_SHIFT: null
        WL_SPACE: null
        PER_WL_RCC: null

  implementation:
    mode: inversion
    n_cores: null
    task_inflation_factor: 10
    ip_head: null
    redis_password: null
    ray_include_dashboard: false
    ray_temp_dir: /tmp/ray
    ray_ignore_reinit_error: true
    io_buffer_size: 100
    max_hash_table_size: 50
    pixel_heuristic_priors: []
    debug_mode: false
    inversion:
      windows: [[350.0, 1360.0], [1410, 1800.0], [1970.0, 2500.0]]
      cressie_map_confidence: false
      integration_grid: {}
      priors_in_initial_guess: true
      inversion_grid_as_preseed: false
      mcmc:
        iterations: 10000
        burnin: 200
        regularizer: 0.001
        proposal_scaling: 0.01
        verbose: true
        restart_every: 2000
      least_squares_params:
        method: trf
        max_nfev: 20
        xtol: null
        ftol: 0.01
        gtol: null
        tr_solver: lsmr
