# On every merge (push) to the `dev` branch, regenerate the example test results
# and publish them directly to the `main` branch of the isofit/isofit-test-results
# repository.
#
# Unlike the PR flow (build.yml -> results_upload.yml), this workflow runs in the
# main repository on a trusted push event, so it has direct access to the repo
# SECRETS and does not need the `workflow_run` indirection. It reuses the same
# reusable results workflows the PR build uses, then commits the fresh results
# straight onto `main` (i.e. merges them in) rather than opening a PR.
#
# This workflow is TRUSTED. It has access to the repo SECRETS.
name: Publish Dev Results

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.cache_key.outputs.cache_key }}
    steps:
      - name: Cache Extras
        id: cache-extras
        uses: actions/cache/restore@v4
        with:
          path: .isofit
          key: extras
          restore-keys: |
            extras
          enableCrossOsArchive: true

      - name: Verify cache
        if: steps.cache-extras.outputs.cache-hit != 'true'
        run: |
          echo "::error::No cache found. Run the Build workflow to populate it."
          exit 1

  imagecube-small:
    needs: cache
    uses: ./.github/workflows/results_imagecube_small.yml
    with:
      cache-key: ${{ needs.cache.outputs.cache_key }}

  lakemary:
    needs: cache
    uses: ./.github/workflows/results_lakemary.yml
    with:
      cache-key: ${{ needs.cache.outputs.cache_key }}

  seabass:
    needs: cache
    uses: ./.github/workflows/results_seabass.yml
    with:
      cache-key: ${{ needs.cache.outputs.cache_key }}

  # Push to ISOFIT-Test-Results
  publish:
    needs: [imagecube-small, lakemary, seabass]
    runs-on: ubuntu-latest
    env:
      SHA: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
    steps:
      - name: Checkout tests repo
        uses: actions/checkout@v6
        with:
          repository: isofit/isofit-test-results
          token: ${{ secrets.ISOFIT_TEST_RESULTS }}
          ref: main
          path: results

      - name: Prepare results
        run: rm -rf results/dev

      - uses: actions/download-artifact@v8
        with:
          path: results/dev

      - name: Commit and push to main
        working-directory: results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40919026+github-actions[bot]@users.noreply.github.com"

          git add dev
          if git diff --cached --quiet; then
            echo "No result changes to publish."
            exit 0
          fi

          git commit -m "Dev results for ${SHA}"
          git push origin main
